{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablecer contraseña</title>
    <link rel="stylesheet" href="{% static 'core/css/newPassword.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'core/css/materialize.css' %}">
</head>
<body class="fade-in">
    <div class="main">
        <a href="{% url 'index' %}" class="home-icon" title="Volver al inicio">
            <i class="fas fa-home"></i>
        </a>
        <div class="center">
            <h1>Restablecer contraseña</h1>

            <form method="post" id="restablecerForm">
                {% csrf_token %}
                <div class="Username">
                    <input type="password" id="nueva_contraseña" name="nueva_contraseña" required minlength="8">
                    <label>Nueva contraseña</label>
                    <span></span>
                </div>
                <div class="Username">
                    <input type="password" id="confirmar_contraseña" name="confirmar_contraseña" required minlength="8">
                    <label>Confirmar contraseña</label>
                    <span></span>
                </div>

                <input type="submit" value="Confirmar">

                {% if mensaje %}
                    <p id="mensaje" style="color: green;">{{ mensaje }}</p>
                {% endif %}
                {% if error %}
                    <p id="mensaje" style="color: red;">{{ error }}</p>
                {% endif %}
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('restablecerForm');
        form.addEventListener('submit', function(e) {
            const pass1 = document.getElementById('nueva_contraseña').value;
            const pass2 = document.getElementById('confirmar_contraseña').value;

            if (pass1 !== pass2) {
                e.preventDefault();
                alert('Las contraseñas no coinciden');
            }
        });
    </script>
</body>
</html>
