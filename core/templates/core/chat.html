{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio</title>
    <link rel="stylesheet" href="{% static 'core/css/chat.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <main class="main">
        <div class="top">
             <a href="{% url 'index' %}" class="home-icon" title="Volver al inicio">
                <i class="fas fa-home"></i>
            </a>
            <div class="nav" id="nav">
                <div class="signup">
                    {% if user.is_authenticated %}
                    <div class="account-dropdown">
                        <button class="account-btn" id="accountBtn">
                            <div class="profile-name">{{ usuario.nombre }}</div>
                            <div class="account-avatar">
                                {% if user.foto_perfil %}
                                    <img src="{{ user.foto_perfil.url }}" alt="Foto de perfil">
                                {% else %}
                                    <i class="fas fa-user"></i>
                                {% endif %}
                            </div>
                        </button>

                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="{% url 'profile' %}" class="dropdown-item">
                                <i class="fas fa-user"></i>
                                Ver perfil
                            </a>
                            <a href="#" onclick="document.getElementById('logout-form').submit(); return false;" class="dropdown-item">
                                <i class="fas fa-sign-out-alt"></i>
                                    Cerrar sesión
                            </a>
                        </div>

                        <form id="logout-form" method="post" action="{% url 'logout' %}" style="display: none;">
                            {% csrf_token %}    
                        </form>
                    </div>
                    {% else %}
                    <ul>
                        <li><a href="{% url 'login' %}">Iniciar Sesión</a></li>
                        <li><a href="{% url 'register' %}">Registrarse</a></li>
                    </ul>
                    {% endif %}
                </div>
            </div>
        </div>

        <div class="center">
            <div class="logo">
                <div class="logo-img"></div>
            </div>
            <h1 class="h1">Bienvenido a DermaChat {{ usuario.nombre }}</h1>
        </div>

        <div class="bottom">
            <div class="textito">
            <form method="get" action="#" class="search-bar">
            <div class="searching">
                <button type="button" class="upload-btn">
                <i class="fas fa-image"></i>
                </button>
                <input type="text" name="q" placeholder="Comunicate conmigo..." class="custom-search">
                <button type="submit" class="search-btn">
                <i class="fas fa-search"></i>
                </button>
            </div>
            </form>
            </div>
        </div>

    </main>
    <script src="{% static 'core/js/main.js' %}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const accountBtn = document.getElementById('accountBtn');
            const dropdownMenu = document.getElementById('dropdownMenu');
            
            if (accountBtn && dropdownMenu) {
                accountBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    dropdownMenu.classList.toggle('show');
                });

                document.addEventListener('click', function(e) {
                    if (!accountBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
                        dropdownMenu.classList.remove('show');
                    }
                });
            }
        });
    </script>
