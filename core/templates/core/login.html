{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="{% static 'core/css/login.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="fade-in">
  <div class="main">
    <a href="{% url 'index' %}" class="home-icon" title="Volver al inicio">
        <i class="fas fa-home"></i>
      </a>
    <div class="right">
      <h1>Iniciar sesión</h1>
      <div id="validation_errors" role="alert" aria-live="assertive" style="display: none;"></div>
      <form id="loginForm" novalidate>
        {% csrf_token %}
        <div class="Username">
            <input type="email"  id="email"  required>
            <label for="email">Correo electrónico</label>
            <span></span>
        </div>
        <div class="Username">
            <input type="password" id="password"  required>
            <label for="password">Contraseña</label>
            <span></span>
        </div>

        <div class="recordar">
          <a href="{% url 'recuperar' %}">¿Olvidó su contraseña?</a> </div>
        <input type="submit" value="Iniciar sesión">
        <div class="registrarse">
          <label>¿No tiene una cuenta?</label>
          <a href="{% url 'register' %}">Registrarse</a>
        </div>
        <p id="mensaje" role="alert" aria-live="assertive" class="error-message" style="color: red;"></p>
      </form>
    </div>
    <div class="left">
      <div class="img">
        </div>
    </div>
  </div>

  <script>
    // Prevenir tooltips nativos del navegador
    document.querySelectorAll('#loginForm input[required]').forEach(function(input) {
      input.addEventListener('invalid', function(e) {
        e.preventDefault();
      });
    });

    const form = document.getElementById('loginForm');
    const mensaje = document.getElementById('mensaje');
    const validationErrors = document.getElementById('validation_errors');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      // Limpiar mensajes previos
      validationErrors.style.display = 'none';
      validationErrors.innerHTML = '';
      mensaje.textContent = '';
      
      let errors = [];
      
      if (!email) {
        errors.push('El correo electrónico es requerido');
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errors.push('El correo electrónico debe ser válido');
      }
      
      if (!password) {
        errors.push('La contraseña es requerida');
      }
      
      if (errors.length > 0) {
        validationErrors.innerHTML = '<p style="color: red; text-align: center; margin: 10px 0;"><i class="fas fa-exclamation-triangle"></i> ' + errors.join(' | ') + '</p>';
        validationErrors.style.display = 'block';
        return;
      }

      try {
        const response = await fetch("{% url 'login_usuario' %}", {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          if (data.redirect) {
            window.location.href = data.redirect;
          } else {
            window.location.href = "{% url 'index' %}";
          }
        } else {
          mensaje.textContent = data.error || "Error desconocido";
        }
      } catch (err) {
        mensaje.textContent = "Error de conexión";
      }
    });
  </script>
  <script>
    document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
      window.location.href = "{% url 'index' %}";
         }
     });
  </script>

</body>
</html>
