{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse</title>
  <link rel="stylesheet" href="{% static 'core/css/register.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="fade-in">
  <div class="main">
    <a href="{% url 'index' %}" class="home-icon" title="Volver al inicio">
        <i class="fas fa-home"></i>
      </a>
      <div class="left">
        <h1>Registro</h1>
        {% if error %}
        <p style="color: red; text-align: center;">{{ error }}</p>
        {% endif %}
        <form method="post" action="{% url 'register' %}" id="registerForm">
          {% csrf_token %}
          <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
          <input type="hidden" name="tipo_usuario" value="cliente">
          <div class="Username">
              <input type="text" name="nombre" id="id_nombre" required>
              <label for="id_nombre">Nombre de usuario</label>
              <span></span>
          </div>
          <div class="Username">
              <input type="email" name="email" id="id_email" required>
              <label for="id_email">Correo electrónico</label>
              <span></span>
          </div>
          <div class="Username">
              <input type="password" name="password" id="id_password" required>
              <label for="id_password">Contraseña</label>
              <span></span>
          </div>
          <div class="Username">
              <input type="password" name="confirm_password" id="id_confirm_password" required>
              <label for="id_confirm_password">Confirmar contraseña</label>
              <span></span>
          </div>
          <p id="password_error" style="color: red; display: none;">Las contraseñas no coinciden</p>
          <input type="submit" value="Registrarse">
          <div class="iniciar">
              ¿Ya se registró?<a href="{% url 'login' %}">Iniciar sesión</a>
          </div>
        </form>
      </div>

      <div class="right">
        <div class="img">  
          </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;
      const errorElement = document.getElementById('password_error');

      if (password !== confirmPassword) {
        e.preventDefault();
        errorElement.style.display = 'block';
      } else {
        errorElement.style.display = 'none';
      }
    });
  </script>
</body>
</html>
