{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse</title>
  <link rel="stylesheet" href="{% static 'core/css/register.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="fade-in">
  <div class="main">
    <a href="{% url 'index' %}" class="home-icon" title="Volver al inicio">
        <i class="fas fa-home"></i>
      </a>
      <div class="left">
        <h1>Registro</h1>
        {% if error %}
        <p role="alert" aria-live="assertive" class="error-message" style="color: red; text-align: center;">
            <i class="fas fa-exclamation-triangle" aria-hidden="true"></i> {{ error }}
        </p>
        {% endif %}
        <div id="validation_errors" role="alert" aria-live="assertive" style="display: none;"></div>
        <form method="post" action="{% url 'register' %}" id="registerForm" novalidate>
          {% csrf_token %}
          <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
          <input type="hidden" name="tipo_usuario" value="cliente">
          <div class="Username">
              <input type="text" name="nombre" id="id_nombre" required>
              <label for="id_nombre">Nombre de usuario</label>
              <span></span>
          </div>
          <div class="Username">
              <input type="email" name="email" id="id_email" required>
              <label for="id_email">Correo electrónico</label>
              <span></span>
          </div>
          <div class="Username">
              <input type="password" name="password" id="password" required>
              <label for="password">Contraseña</label>
              <span></span>
          </div>
          <div class="Username">
              <input type="password" name="confirm_password" id="confirm_password" required>
              <label for="confirm_password">Confirmar contraseña</label>
              <span></span>
          </div>
          <input type="submit" value="Registrarse">
          <div class="iniciar">
              ¿Ya se registró?<a href="{% url 'login' %}">Iniciar sesión</a>
          </div>
        </form>
      </div>

      <div class="right">
        <div class="img">  
          </div>
      </div>
    </div>
  </div>

  <script>
    // Prevenir tooltips nativos del navegador
    document.querySelectorAll('#registerForm input[required]').forEach(function(input) {
      input.addEventListener('invalid', function(e) {
        e.preventDefault();
      });
    });

    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const nombre = document.getElementById('id_nombre').value.trim();
      const email = document.getElementById('id_email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;
      const errorContainer = document.getElementById('validation_errors');
      
      let errors = [];
      
      if (!nombre) {
        errors.push('El nombre de usuario es requerido');
      }
      
      if (!email) {
        errors.push('El correo electrónico es requerido');
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errors.push('El correo electrónico debe ser válido');
      }
      
      if (!password) {
        errors.push('La contraseña es requerida');
      }
      
      if (!confirmPassword) {
        errors.push('La confirmación de contraseña es requerida');
      }
      
      if (password && confirmPassword && password !== confirmPassword) {
        errors.push('Las contraseñas no coinciden');
      }
      
      if (errors.length > 0) {
        errorContainer.innerHTML = '<p style="color: red; text-align: center; margin: 10px 0;"><i class="fas fa-exclamation-triangle"></i> ' + errors.join(' | ') + '</p>';
        errorContainer.style.display = 'block';
      } else {
        errorContainer.style.display = 'none';
        this.submit();
      }
    });
  </script>
    <script>
    document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
      window.location.href = "{% url 'index' %}";
         }
     });
    </script>

</body>
</html>
