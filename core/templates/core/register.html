{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse</title>
  <link rel="stylesheet" href="{% static 'core/css/register.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="main">
    <a href="{% url 'index' %}" class="home-icon" title="Volver al inicio">
        <i class="fas fa-home"></i>
      </a>
    <div class="center">
      <h1>Registrarse</h1>
      {% if error %}
      <p style="color: red; text-align: center;">{{ error }}</p>
      {% endif %}
      <form method="post" action="{% url 'register' %}" id="registerForm">
        {% csrf_token %}
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
        <input type="hidden" name="tipo_usuario" value="cliente">
        <div class="Username">
            <input type="text" name="nombre" required>
            <label>Nombre de usuario</label>
            <span></span>
        </div>
        <div class="Username">
            <input type="email" name="email" required>
            <label>Correo electrónico</label>
            <span></span>
        </div>
        <div class="Username">
            <input type="password" name="password" id="password" required>
            <label>Contraseña</label>
            <span></span>
        </div>
        <div class="Username">
            <input type="password" name="confirm_password" id="confirm_password" required>
            <label>Confirmar contraseña</label>
            <span></span>
        </div>
        <p id="password_error" style="color: red; display: none;">Las contraseñas no coinciden</p>
        <input type="submit" value="Registrarse">
        <div class="iniciar">
            ¿Ya se registró?<a href="{% url 'login' %}">Iniciar sesión</a>
        </div>
        <div class="iniciar">
            ¿Es usted dueño de gimnasio?<a href="{% url 'register_own' %}">Registrese aqui!</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;
      const errorElement = document.getElementById('password_error');

      if (password !== confirmPassword) {
        e.preventDefault();
        errorElement.style.display = 'block';
      } else {
        errorElement.style.display = 'none';
      }
    });
  </script>
</body>
</html>
